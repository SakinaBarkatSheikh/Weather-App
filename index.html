<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Weather Dashboard with real-time weather and forecast">

    <title>Weather Dashboard</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/weather-icons.css">
    <link rel="stylesheet" href="css/responsive.css">

    <!-- Leaflet Map CSS -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

</head>

<body>

<div class="container">

    <!-- HEADER -->
    <header>

        <h1>🌤️ Weather Dashboard</h1>

        <p>
            Real-time weather information and forecast
        </p>

    </header>


    <!-- SEARCH -->
    <section class="search-section">

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Enter city name"
                autocomplete="off"
            >

            <div id="suggestions"></div>

        </div>

        <button id="searchBtn">
            🔍 Search
        </button>

        <button id="locationBtn">
            📍 My Location
        </button>

    </section>


    <!-- CONTROLS -->
    <section class="controls">

        <button id="unitToggle">
            🌡️ °C
        </button>

        <button id="themeToggle">
            🌙 Dark Mode
        </button>

        <button id="favoriteBtn">
            ⭐ Add Favorite
        </button>

        <button id="shareBtn">
            📤 Share
        </button>

    </section>


    <!-- FAVORITES -->
    <section class="favorites-section">

        <h2>⭐ Favorite Cities</h2>

        <div id="favorites"></div>

    </section>


    <!-- LOADING -->
    <div id="loading">
        Loading weather data...
    </div>


    <!-- ERROR -->
    <div id="error"></div>


    <!-- WEATHER ALERTS -->
    <section class="alerts-section">

        <h2>⚠️ Weather Alerts</h2>

        <div id="alerts"></div>

    </section>


    <!-- CURRENT WEATHER -->
    <section>

        <h2 class="section-title">
            Current Weather
        </h2>

        <div id="currentWeather"></div>

    </section>


    <!-- FORECAST -->
    <section>

        <h2 class="section-title">
            5-Day Forecast
        </h2>

        <div id="forecast"></div>

    </section>


    <!-- MAP -->
    <section class="map-section">

        <h2 class="section-title">
            🗺️ Weather Map
        </h2>

        <div id="weatherMap"></div>

    </section>

</div>


<!-- LEAFLET JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<!-- JAVASCRIPT -->

<script src="js/config.js"></script>

<script src="js/weatherService.js"></script>

<script src="js/storage.js"></script>

<script src="js/ui.js"></script>

<script src="js/app.js"></script>

</body>

</html>
